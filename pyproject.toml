[project]
name = "metadata-agent"
version = "0.1.0"
description = "An agentic generative (LLM-based) tool for extracting metadata from datasets."
readme = "readme.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "com3dian" }]
dependencies = [
    "langchain>=1.2.15",
    "langchain-google-genai>=4.2.2",
    "langchain-openai>=1.2.0",
    "langgraph>=1.2.4",
    "myst-parser>=3.0.1",
    "pandas>=2.2,<3",
    "pydantic>=2.13.3",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "ruff>=0.15.11",
    "textual>=8.2.7",
]

[project.scripts]
metadata-agent = "src.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]

[tool.pytest.ini_options]
# Collect only from tests/. Without this, pytest walks the whole tree and can
# collide on basenames with copies Sphinx drops under the gitignored docs/_build
# (e.g. a downloadable test_compile.py), aborting collection.
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

include = [
  "demo_app.py",
  "demo/**/*.py",
  "examples/**/*.py",
  "tests/**/*.py",
]

exclude = [
  ".git",
  ".venv",
  "notebooks",
]

[dependency-groups]
demo = [
    "pyyaml>=6.0.3",
    "streamlit>=1.57.0",
    "watchdog>=6.0.0",
]
docs = [
    "myst-parser>=2,<4",
    "pydata-sphinx-theme>=0.15,<0.17",
    "sphinx>=7.2,<8",
    "sphinx-autoapi>=3.0,<4",
    "sphinx-copybutton>=0.5,<0.6",
]
tracking = [
    "wandb>=0.27.0",
    "weave>=0.52.41",
]
